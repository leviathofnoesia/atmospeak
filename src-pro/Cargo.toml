[package]
name = "atmospeak-pro"
version = "1.0.3"
description = "Atmospeak Pro-only modules (separate build; keep this crate private in production)"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
