name: Temporary Atmospeak cumulative frontend validation

# Validate the two cumulative trees needed for serial frontend cleanup merges.
# Do not merge this workflow into main or a product PR.
on:
  push:
    branches: [validation/atmospeak-frontend-20261010]
    paths: [.github/workflows/temporary-frontend-validation.yml]

permissions:
  contents: read

concurrency:
  group: atmospeak-frontend-validation-20261010
  cancel-in-progress: false

jobs:
  validate:
    name: Windows / ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: cumulative-through-pr27
            sha: fb70c7eaf80c04e59d593eda5e35e070f3a47a97
            merge_shas: 6a73b13e70b8a4b908633f9edaf6e9bb161a4a90 c777cec80898ec36edcf08afbc43716e0e68fa7d
            depth: 0
          - label: cumulative-through-pr28
            sha: fb70c7eaf80c04e59d593eda5e35e070f3a47a97
            merge_shas: 6a73b13e70b8a4b908633f9edaf6e9bb161a4a90 c777cec80898ec36edcf08afbc43716e0e68fa7d d4e0a4dd8f14517e62d10337b32cf45728937bfb
            depth: 0
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      GIT_LFS_SKIP_SMUDGE: "1"
      PLAYWRIGHT_HTML_OPEN: never
      HEAD_SHA: ${{ matrix.sha }}
      MERGE_SHAS: ${{ matrix.merge_shas }}

    steps:
      - name: Check out immutable frontend source without LFS
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, GitHub
        with:
          repository: leviathofnoesia/atmospeak
          ref: ${{ matrix.sha }}
          fetch-depth: ${{ matrix.depth }}
          lfs: false
          persist-credentials: false

      - name: Verify source and prepare the exact integration tree
        id: source
        run: |
          if ((git rev-parse HEAD) -ne $env:HEAD_SHA) { throw "Unexpected source commit" }
          if ($LASTEXITCODE -ne 0) { throw "Cannot identify source" }
          $mergeHeads = @($env:MERGE_SHAS -split ' ' | Where-Object { $_ })
          foreach ($parent in $mergeHeads) {
            git cat-file -e "$parent^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Pinned integration parent is missing: $parent" }
          }
          if ($mergeHeads.Count) {
            git -c user.name="Atmospeak validation" -c user.email="validation@invalid" merge --no-commit --no-ff @mergeHeads
            if ($LASTEXITCODE -ne 0) { throw "Pinned integration has a merge conflict" }
          }
          $tree = git write-tree
          if ($LASTEXITCODE -ne 0) { throw "Cannot identify validation tree" }
          "SOURCE_TREE=$tree" >> $env:GITHUB_ENV
          "Head: $env:HEAD_SHA`nMerge parents: $($mergeHeads -join ", ")`nTree: $tree" >> $env:GITHUB_STEP_SUMMARY

      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, GitHub
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, Bun publisher
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install frozen frontend dependencies
        id: install
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Typecheck and build application
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: bun run build

      - name: Run frontend unit tests
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: bun run test

      - name: Typecheck and build website
        id: site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: bun run site:build

      - name: Install the lockfile-selected Playwright Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node node_modules/@playwright/test/cli.js install chromium

      - name: Run all 12 Windows browser tests, including existing visual baselines
        id: e2e
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        continue-on-error: true
        run: bun run e2e --workers=1 --trace=retain-on-failure --reporter=line,html

      - name: Verify tested source was not changed by validation
        id: unchanged
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        continue-on-error: true
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Validation changed tracked source" }
          if ((git write-tree) -ne $env:SOURCE_TREE) { throw "Validation changed the index tree" }
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify final source tree" }

      - name: Preserve only browser diagnostic reports, for one day
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, GitHub
        with:
          name: browser-diagnostics-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1

      - name: Report every outcome and fail if any expected check did not pass
        if: ${{ !cancelled() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          $steps = $env:STEP_OUTCOMES | ConvertFrom-Json
          $required = @('checkout', 'source', 'install', 'build', 'unit', 'site', 'browser', 'e2e', 'unchanged')
          $failed = @()
          foreach ($id in $required) {
            $outcome = $steps.$id.outcome
            "$id : $outcome" >> $env:GITHUB_STEP_SUMMARY
            if ($outcome -ne 'success') { $failed += "$id=$outcome" }
          }
          if ($failed.Count) { throw ("Validation incomplete or failed: " + ($failed -join ', ')) }

