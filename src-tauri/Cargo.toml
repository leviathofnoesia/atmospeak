[package]
name = "atmospeak"
version = "1.0.3"
description = "Local-first desktop dictation prototype"
authors = ["Atmospeak"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang.org/cargo/issues/8519
name = "atmospeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Separate Pro binary: online Polar licence, gated updater, Pro modules from atmospeak-pro.
pro = ["dep:atmospeak-pro"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
atmospeak-asr-protocol = { path = "../src-asr-protocol" }
atmospeak-pro = { path = "../src-pro", optional = true }
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
dirs = "6"
hound = "3"
parking_lot = "0.12"
keyring = "3"
regex = "1"
rmp-serde = "1.3"
# The ASR host is loopback-only; rustls is enabled for HTTPS model downloads.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "multipart",
  "rustls-tls",
] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
